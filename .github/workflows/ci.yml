name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: fc-cache
          key: fc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/fc-cache

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test (Unix)
        if: runner.os != 'Windows'
        # Exclude [4d] reconnection tests: QUIC/UDP to closed ports on CI runners
        # doesn't get immediate connection refused — msquic waits for idle timeout
        run: ./build/panaudia-core-tests '~[integration]~[4d]'

      - name: Test statecache (Unix)
        if: runner.os != 'Windows'
        run: ./build/panaudia-statecache-tests

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/panaudia-core-tests.exe "~[integration]~[4d]"

      - name: Test statecache (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/panaudia-statecache-tests.exe

      - name: Benchmark (Unix)
        if: runner.os != 'Windows'
        run: ./build/panaudia-bench

      - name: Benchmark (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/panaudia-bench.exe

  tsan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: fc-cache
          key: fc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure with TSan
        run: cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/fc-cache

      - name: Build
        run: cmake --build build-tsan -j$(nproc)

      - name: Test under TSan
        # Exclude [stress] tests: concurrent SPSC ring buffer operations
        # produce TSan false positives on data_[] (TSan can't reason about
        # the SPSC invariant that writer and reader access disjoint regions).
        run: ./build-tsan/panaudia-core-tests '~[stress]' '~[integration]' '~[4d]'

      - name: Test statecache under TSan
        run: ./build-tsan/panaudia-statecache-tests
